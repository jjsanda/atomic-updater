# RAUC system config for the containerized device simulator.
# Mirrors the real device config (design doc §7.3) with two substitutions:
#   - slots are file-backed images instead of eMMC partitions
#   - bootloader=custom drives a script that reproduces the U-Boot
#     BOOT_ORDER/BOOT_x_LEFT semantics of §7.2
# The keyring is bind-mounted from the checkout's dev PKI at runtime.

[system]
compatible=acme-device-v1
bootloader=custom
data-directory=/data/rauc

[handlers]
bootloader-custom-backend=/usr/bin/custom-backend.sh

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/data/slots/rootfs-A.img
type=ext4
bootname=A

[slot.rootfs.1]
device=/data/slots/rootfs-B.img
type=ext4
bootname=B

# NOTE: authored for the org CI runners; NOT built/validated in this workspace.
# systemd-tmpfiles manifest applied by atomic-data-seed.service (design.md
# §7.1). Idempotent: 'd' creates only if missing, 'C' copies only if the
# destination does not exist (first boot on a fresh data partition).
#
# Type Path                         Mode UID  GID  Age Argument

# overlayfs upper/work for /etc
d /data/overlays                    0755 root root -
d /data/overlays/etc                0755 root root -
d /data/overlays/etc/upper          0755 root root -
d /data/overlays/etc/work           0755 root root -

# RAUC runtime state (system.conf data-directory=/data/rauc, design.md §7.3)
d /data/rauc                        0700 root root -

# agent state + pending bundle download area (design.md §7.5)
d /data/atomic-updater              0750 root root -

# one-shot copy of the pristine rootfs content for the bind mounts
C /data/var                         -    -    -    -   /var
C /data/home                        -    -    -    -   /home

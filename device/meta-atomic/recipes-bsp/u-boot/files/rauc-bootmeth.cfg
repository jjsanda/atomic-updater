# NOTE: authored for the org CI runners; NOT built/validated in this workspace.
# U-Boot Kconfig fragment — standard boot flow with the upstream RAUC
# bootmeth (design.md §6.2), environment stored as a file in the FAT boot
# partition (design.md §7.1 "boot" partition holds the U-Boot env).
#
# VERIFY-ON-BUILDER: requires U-Boot >= v2025.01 for CONFIG_BOOTMETH_RAUC
# (see u-boot_%.bbappend header). Option names below must be checked against
# the exact U-Boot version finally pinned.

# bootstd + full bootflow commands (bootflow scan/list/select)
CONFIG_BOOTSTD=y
CONFIG_BOOTSTD_FULL=y
CONFIG_BOOTSTD_DEFAULTS=y

# RAUC A/B slot selection: reads BOOT_ORDER / BOOT_A_LEFT / BOOT_B_LEFT from
# the environment, decrements the tried slot, appends rauc.slot=<X> to the
# kernel command line (design.md §7.2 boot flow).
CONFIG_BOOTMETH_RAUC=y

# --- environment in a FAT file on partition 1 (mmc 0:1) ---------------------
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
# must match ATOMIC_UBOOT_ENV_SIZE (bbappend) and /etc/fw_env.config
CONFIG_ENV_SIZE=0x4000
# saveenv must be able to write the FAT file
CONFIG_FAT_WRITE=y

# NOTE: authored for the org CI runners; NOT built/validated in this workspace.
#
# meta-atomic layer configuration (design.md §6.3, §14).
# Target release: Yocto Scarthgap (5.0 LTS).

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-atomic"
BBFILE_PATTERN_meta-atomic = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-atomic = "10"

# VERIFY-ON-BUILDER: meta-rauc's BBFILE_COLLECTIONS name is believed to be
# "rauc" (check meta-rauc/conf/layer.conf on the pinned revision and adjust).
# We deliberately do NOT depend on meta-raspberrypi here: the same layer is
# used for qemux86-64 builds that do not stack the RPi BSP. The rpi-only
# recipes/appends in this layer are guarded with :rpi machine overrides.
LAYERDEPENDS_meta-atomic = "core rauc"

LAYERSERIES_COMPAT_meta-atomic = "scarthgap"

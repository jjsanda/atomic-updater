# NOTE: authored for the org CI runners; NOT built/validated in this workspace.
# RAUC system configuration — x86-64 EFI (qemux86-64 / generic mini-PC).
#
# DOCUMENTED AUTHORED DECISION: design.md §7.3 only spells out the rpi
# variant. This x86 variant follows §6.2 ("GRUB behind the RAUC EFI
# backend"): bootloader=efi drives efibootmgr --bootorder/--bootnext, and
# slots resolve via GPT partition names written by
# wic/atomic-x86-efi.wks.in (--part-name rootfs.A / rootfs.B).
#
# VERIFY-ON-BUILDER: the efi backend matches EFI boot manager entries by
# their label == bootname ("A"/"B"); those entries must be created once at
# provisioning time (efibootmgr -c -L A ... / -L B ...) — see README
# "validate first".

[system]
compatible=acme-device-v1
bootloader=efi
data-directory=/data/rauc

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs.A
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs.B
type=ext4
bootname=B

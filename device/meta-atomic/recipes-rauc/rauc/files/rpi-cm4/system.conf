# NOTE: authored for the org CI runners; NOT built/validated in this workspace.
# RAUC system configuration — Raspberry Pi CM4 (design.md §7.3, verbatim).
# MBR partition table -> raw mmcblk0pN device paths (no GPT part-labels on
# the Pi; see wic/atomic-rpi.wks.in).

[system]
compatible=acme-device-v1
bootloader=uboot
data-directory=/data/rauc

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B

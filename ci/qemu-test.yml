---
# ci/qemu-test.yml — `test:integration`: the repo's compose-based OTA suite
# (make images bundles e2e) plus the Yocto/QEMU system-boot job.
#
# NOTE: these jobs target the org's GitLab runners (`dind` class — privileged
# docker executor, see ci/shared/runners.md); they are NOT runnable in this
# development workspace. On org runners this stage additionally boots the
# Yocto qemux86-64 system image per design.md §13.2 — that half is stubbed
# below until the dedicated Yocto runner is up.

integration:ota-e2e:
  stage: test:integration
  image: golang:1.22-bookworm
  services:
    - name: docker:27-dind
      alias: docker
  tags: [dind]
  interruptible: true
  timeout: 1h15m
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_VERSION: "27.1.1"
    COMPOSE_VERSION: "v2.29.1"
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  cache:
    key: go-e2e
    paths:
      - .cache/
  before_script:
    # The golang image lacks a docker client; install static CLI + compose
    # plugin so the Makefile targets work against the dind service.
    - >
      curl -fsSL
      "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz"
      | tar -xz --strip-components=1 -C /usr/local/bin docker/docker
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - >
      curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose
      "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
    - docker info
  script:
    # Full OTA e2e: build rauc-tools + device-sim images, dev PKI + signed
    # test bundles, then the compose-based suite (server + Postgres + MinIO
    # + simulated devices; scenarios per design.md §13.2).
    - make images bundles e2e
  artifacts:
    when: on_failure
    paths:
      # Contract: the e2e suite dumps compose service logs here on failure.
      - e2e/logs/
    expire_in: 1 week

integration:qemu-system:
  stage: test:integration
  image: golang:1.22-bookworm
  tags: [dind]
  interruptible: true
  allow_failure: true  # pending Yocto runner bring-up
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: device:bundle
      parallel:
        matrix:
          - TARGET: qemux86-64
            YOCTO_MACHINE: qemux86-64
      artifacts: false
  script:
    # STUB (design.md §13.2): once the Yocto runner is up this job will
    #   1. pull the qemux86-64 wic image + dev-signed bundle from
    #      staging/${CI_PIPELINE_ID}/qemux86-64/ in the bundle store,
    #   2. boot it under qemu-system-x86_64 with OVMF + snapshot disk,
    #   3. run the system-level scenarios against a real U-Boot/GRUB +
    #      RAUC + atomic-health stack (TestHappyPath,
    #      TestRollbackOnKernelPanic, TestRollbackOnHealthFail, ...).
    # Until then it fails intentionally and is allow_failure above.
    - echo "qemu system-boot suite not yet wired to the Yocto runner"
    - exit 1

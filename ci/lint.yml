---
# ci/lint.yml — `lint` stage.
#
# NOTE: these jobs target the org's GitLab runners (see ci/shared/runners.md);
# they are NOT runnable in this development workspace. Included from the
# repo-root .gitlab-ci.yml.

.lint-base:
  stage: lint
  tags: [docker]
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

lint:go:
  extends: .lint-base
  image: golang:1.22-bookworm
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    key: go-lint
    paths:
      - .cache/
  script:
    # Same staticcheck pin as `make staticcheck`.
    - (cd server && go vet ./...)
    - (cd server && go run honnef.co/go/tools/cmd/staticcheck@2023.1.7 ./...)
    - (cd device/agent && go vet ./...)
    - (cd device/agent && go run honnef.co/go/tools/cmd/staticcheck@2023.1.7 ./...)

lint:shell:
  extends: .lint-base
  image: koalaman/shellcheck-alpine:stable
  script:
    # -x follows `source` (scripts/pki/*.sh source lib.sh via a
    # "shellcheck source=" directive). pki/ and build output are excluded.
    - >
      find . -name '*.sh'
      -not -path './pki/*'
      -not -path './node_modules/*'
      -not -path './build/*'
      -exec shellcheck -x {} +

lint:yaml:
  extends: .lint-base
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  script:
    - >
      yamllint -d "{extends: default,
      rules: {line-length: {max: 120}, document-start: disable}}"
      .gitlab-ci.yml ci/ e2e/compose.yaml scripts/dev/compose.yaml

lint:ui-typecheck:
  extends: .lint-base
  image: node:22-bookworm-slim
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  cache:
    key:
      files:
        - server/ui/package-lock.json
    paths:
      - .cache/npm
  script:
    - cd server/ui
    - npm ci
    - npx tsc --noEmit
